name: Football Draw Hunter # shadow-history validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/index.js"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: football-draw-hunter
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check src/index.js

      - name: Run Telegram bot
        run: node src/index.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Save forecast history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          for (const [path, collection] of [
            ["data/forecast-history.json", "predictions"],
            ["data/shadow-history.json", "observations"]
          ]) {
            let local = { [collection]: [] };
            try { local = JSON.parse(await readFile(path, "utf8")); } catch {}
            let remote = { [collection]: [] };
            try {
              remote = JSON.parse(execFileSync("git", ["show", "origin/main:" + path], { encoding: "utf8" }));
            } catch {}
            const merged = new Map();
            for (const item of [...(remote[collection] || []), ...(local[collection] || [])]) {
              const key = item.leagueId + ":" + item.eventId;
              const previous = merged.get(key);
              if (!previous || (previous.status !== "settled" && item.status === "settled")) merged.set(key, item);
            }
            const output = { [collection]: [...merged.values()], updatedAt: new Date().toISOString() };
            await writeFile(path, JSON.stringify(output, null, 2) + "\n");
          }
          NODE
          git add data/forecast-history.json data/shadow-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update forecast history"
            git push origin HEAD:main
          fi
